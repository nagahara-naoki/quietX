<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Quiet X icon</title>
  <desc id="desc">A stylized X covered by a red suppression ring and diagonal bar.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15191f"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="control" x1="110" y1="96" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#d81f2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="#252b33" stroke-width="16" opacity="0.9"/>

  <g filter="url(#shadow)" opacity="0.96">
    <path d="M144 132L372 380" stroke="#f7fbff" stroke-width="68" stroke-linecap="round"/>
    <path d="M368 132L140 380" stroke="#f7fbff" stroke-width="68" stroke-linecap="round"/>
    <path d="M144 132L372 380" stroke="#0a0c10" stroke-width="28" stroke-linecap="round" opacity="0.18"/>
    <path d="M368 132L140 380" stroke="#0a0c10" stroke-width="28" stroke-linecap="round" opacity="0.18"/>
  </g>

  <circle cx="256" cy="256" r="164" fill="#050608" opacity="0.12"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="url(#control)" stroke-width="56" opacity="0.78"/>
  <path d="M148 364L364 148" stroke="#f7fbff" stroke-width="78" stroke-linecap="round" opacity="0.38"/>
  <path d="M148 364L364 148" stroke="url(#control)" stroke-width="54" stroke-linecap="round" opacity="0.76"/>
  <path d="M104 430L430 104" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.24"/>
</svg>